name: CI

permissions:
  contents: read

# PR 開到 develop / main 時先跑一次；合併（push）到 develop / main 後再跑一次
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 專案初始化（INIT）合併前還沒有 Makefile，後續步驟全部跳過
      - name: Detect Makefile
        id: detect
        run: if [ -f Makefile ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      # TODO(INIT): architect 依技術棧調整下面的語言版本
      - name: Set up Python
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      # CI 用 .env.example 的預設值；需要機密的測試改用 GitHub secrets
      - name: Prepare env
        if: steps.detect.outputs.found == 'true'
        run: if [ -f .env.example ]; then cp .env.example .env; fi
      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: make ci-setup
      - name: Check
        if: steps.detect.outputs.found == 'true'
        run: make check
