name: CI

permissions:
  contents: read

# PR 開到 develop / main 時先跑一次；合併（push）到 develop / main 後再跑一次
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 專案初始化（INIT）合併前還沒有 Makefile，後續步驟全部跳過
      - name: Detect Makefile
        id: detect
        run: if [ -f Makefile ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      # 語言版本與本機開發環境一致（Temurin 17、Node 24）；版本理由見 docs/design/INIT-01.md
      - name: Set up Java
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Set up Node
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # CI 用 .env.example 的預設值；需要機密的測試改用 GitHub secrets
      - name: Prepare env
        if: steps.detect.outputs.found == 'true'
        run: if [ -f .env.example ]; then cp .env.example .env; fi
      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: make ci-setup
      # Actions 會設 CI=true：make test 一律跑含容器的全部測試（見 docs/design/INIT-01.md「驗證方式」）
      - name: Check
        if: steps.detect.outputs.found == 'true'
        run: make check
